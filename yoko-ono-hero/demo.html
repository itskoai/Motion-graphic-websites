<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoko Ono – scroll walkthrough demo</title>
<style>
  html,body{margin:0;background:#0b0a09;color:#f3ece2;font-family:system-ui,sans-serif}
  .hero{height:500vh;position:relative}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cap{position:absolute;inset:auto 0 12vh;text-align:center;font-size:clamp(28px,7vw,64px);font-weight:700;letter-spacing:.02em;text-shadow:0 2px 20px #000a}
  .after{min-height:100vh;display:grid;place-items:center;font-size:24px}
  @media (prefers-reduced-motion:reduce){.hero{height:100vh}canvas{display:none}}
</style>
</head>
<body>
<section class="hero">
  <div class="stage">
    <img class="poster" src="poster.webp" alt="הכניסה למסעדת יוקו אונו בלילה">
    <canvas id="c"></canvas>
    <div class="cap">YOKO ONO</div>
  </div>
</section>
<section class="after">התוכן של האתר ממשיך כאן</section>
<script>
const N=180, imgs=[], c=document.getElementById('c'), x=c.getContext('2d');
let cur=-1;
for(let i=1;i<=N;i++){const im=new Image();im.src=`frames/f_${String(i).padStart(3,'0')}.webp`;imgs.push(im);}
function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;cur=-1;draw();}
function draw(){
  const h=document.querySelector('.hero'), r=h.getBoundingClientRect();
  const p=Math.min(1,Math.max(0,-r.top/(h.offsetHeight-innerHeight)));
  const i=Math.round(p*(N-1)); if(i===cur)return;
  const im=imgs[i]; if(!im.complete){im.onload=draw;return;}
  cur=i; const s=Math.max(c.width/im.width,c.height/im.height), w=im.width*s, hh=im.height*s;
  x.drawImage(im,(c.width-w)/2,(c.height-hh)/2,w,hh);
}
addEventListener('scroll',()=>requestAnimationFrame(draw),{passive:true});
addEventListener('resize',size); imgs[0].onload=size; size();
</script>
</body>
</html>
