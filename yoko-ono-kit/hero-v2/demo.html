<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoko Ono hero v2 demo</title>
<style>
  html,body{margin:0;background:#0c0a09;color:#f3ece2;font-family:system-ui,sans-serif}
  .hero{height:500vh;position:relative}
  .stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden}
  .poster,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .after{min-height:100vh;display:grid;place-items:center;font-size:24px}
  @media (prefers-reduced-motion:reduce){.hero{height:100vh}canvas{display:none}}
</style>
</head>
<body>
<section class="hero">
  <div class="stage">
    <picture>
      <source media="(min-aspect-ratio: 1/1)" srcset="poster-desktop.webp">
      <img class="poster" src="poster-mobile.webp" alt="הכניסה למסעדת יוקו אונו">
    </picture>
    <canvas id="c"></canvas>
  </div>
</section>
<section class="after">התוכן ממשיך כאן</section>
<script>
const N=172, c=document.getElementById('c'), x=c.getContext('2d');
let set='', imgs=[], cur=-1;
function load(){
  const s=innerWidth/innerHeight>=1?'frames-desktop':'frames-mobile';
  if(s===set)return; set=s; cur=-1; imgs=[];
  for(let i=1;i<=N;i++){const im=new Image();im.src=`${s}/f_${String(i).padStart(3,'0')}.webp`;imgs.push(im);}
  imgs[0].onload=draw;
}
function size(){load();c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;cur=-1;draw();}
function draw(){
  const h=document.querySelector('.hero'), r=h.getBoundingClientRect();
  const p=Math.min(1,Math.max(0,-r.top/(h.offsetHeight-innerHeight)));
  const i=Math.round(p*(N-1)); if(i===cur)return;
  const im=imgs[i]; if(!im||!im.complete){if(im)im.onload=draw;return;}
  cur=i; const s=Math.max(c.width/im.width,c.height/im.height), w=im.width*s, hh=im.height*s;
  x.drawImage(im,(c.width-w)/2,(c.height-hh)/2,w,hh);
}
addEventListener('scroll',()=>requestAnimationFrame(draw),{passive:true});
addEventListener('resize',size); size();
</script>
</body>
</html>
