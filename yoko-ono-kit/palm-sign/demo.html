<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoko Ono palm sign demo v2</title>
<style>
  :root{--red:#d1262f;--ink:#f3ece2;--bg:#0c0a09}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
  .choose{padding:72px 16px;display:grid;justify-items:center;gap:20px}
  .choose h2{margin:0;font-size:clamp(34px,8vw,64px);line-height:1;text-align:center}
  .choose p{margin:0;opacity:.75;text-align:center}
  .scene{perspective:1100px;width:min(92vw,460px)}
  .sign{position:relative;aspect-ratio:1744/2336;border-radius:20px;overflow:hidden;
        transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
  .sign img{width:100%;height:100%;object-fit:cover;display:block}

  /* 1. Light sweep over the engraved leaves, once when the sign enters the screen */
  .sweep{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
    background:linear-gradient(105deg,transparent 40%,rgba(255,214,150,.75) 50%,transparent 60%) no-repeat;
    background-size:300% 100%;background-position:120% 0;
    -webkit-mask-image:
      radial-gradient(ellipse 19% 6% at 24.8% 44%,#000 70%,transparent 100%),
      radial-gradient(ellipse 22% 7.5% at 23.4% 61%,#000 70%,transparent 100%),
      radial-gradient(ellipse 14.5% 6.5% at 65.3% 44%,#000 70%,transparent 100%),
      radial-gradient(ellipse 14.5% 5.5% at 69.7% 52%,#000 70%,transparent 100%);
            mask-image:
      radial-gradient(ellipse 19% 6% at 24.8% 44%,#000 70%,transparent 100%),
      radial-gradient(ellipse 22% 7.5% at 23.4% 61%,#000 70%,transparent 100%),
      radial-gradient(ellipse 14.5% 6.5% at 65.3% 44%,#000 70%,transparent 100%),
      radial-gradient(ellipse 14.5% 5.5% at 69.7% 52%,#000 70%,transparent 100%)}
  .sign.lit .sweep{animation:sweep 2.2s ease-in-out .2s 1 both}
  @keyframes sweep{0%{opacity:1;background-position:120% 0}85%{opacity:1}100%{opacity:0;background-position:-20% 0}}

  /* Leaf glows, one per leaf, grouped by destination */
  .glow{position:absolute;pointer-events:none;border-radius:50%;opacity:0;
        background:radial-gradient(closest-side,rgba(230,40,50,.62),rgba(209,38,47,.18) 70%,rgba(209,38,47,0));
        mix-blend-mode:hard-light;filter:blur(2px);transition:opacity .25s ease}
  .g1{left:5.8%;top:38%;width:38%;height:12%}
  .g2{left:2.4%;top:53.5%;width:42%;height:15%}
  .g3{left:51%;top:37.5%;width:28.6%;height:13%}
  .g4{left:55.4%;top:46.5%;width:28.6%;height:11%}

  /* Hotspot links */
  .leaf{position:absolute;display:block;outline:none;-webkit-tap-highlight-color:transparent;border-radius:28px}
  .restaurant{left:3%;top:38%;width:42%;height:30%}
  .street{left:52%;top:37.5%;width:31%;height:19%}
  .leaf:focus-visible{box-shadow:0 0 0 3px var(--ink)}

  /* 2. Touch response: the sign leans toward the pressed side and the leaves light red */
  .sign:has(.restaurant:hover,.restaurant:focus-visible) .g-rest,
  .sign:has(.street:hover,.street:focus-visible) .g-street,
  .sign.press-rest .g-rest,.sign.press-street .g-street{opacity:1}
  .sign.press-rest{transform:rotateY(-7deg) scale(.985)}
  .sign.press-street{transform:rotateY(7deg) scale(.985)}

  .legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .legend a{color:var(--ink);text-decoration:none;border:1px solid rgba(243,236,226,.4);border-radius:999px;padding:10px 18px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center}
  .legend a.primary{background:var(--red);border-color:var(--red)}
  @media (prefers-reduced-motion:reduce){.sign.lit .sweep{animation:none}.sign{transition:none}.sign.press-rest,.sign.press-street{transform:none}}
</style>
</head>
<body>
<section class="choose" aria-labelledby="choose-title">
  <h2 id="choose-title">בחרו את הדרך שלכם.</h2>
  <p>לחצו על השלט.</p>
  <div class="scene">
    <div class="sign" id="sign">
      <img src="palm-sign.webp" width="1200" height="1608" alt="שלט עץ בצורת דקל ליד הבר: מסעדה, שירות מלא. סטריט סושי, שירות עצמי.">
      <span class="sweep" aria-hidden="true"></span>
      <span class="glow g1 g-rest" aria-hidden="true"></span>
      <span class="glow g2 g-rest" aria-hidden="true"></span>
      <span class="glow g3 g-street" aria-hidden="true"></span>
      <span class="glow g4 g-street" aria-hidden="true"></span>
      <a class="leaf restaurant" data-press="press-rest" href="https://ontopo.com/he/il/page/14510630" aria-label="מסעדה, שירות מלא: הזמינו שולחן"></a>
      <a class="leaf street" data-press="press-street" href="https://wolt.com/he/isr/hasharon/restaurant/yoko-ono" aria-label="סטריט סושי, שירות עצמי: הזמינו בוולט"></a>
    </div>
  </div>
  <div class="legend">
    <a class="primary" href="https://ontopo.com/he/il/page/14510630">מסעדה · הזמינו שולחן</a>
    <a href="https://wolt.com/he/isr/hasharon/restaurant/yoko-ono">סטריט סושי · וולט</a>
  </div>
</section>
<script>
const sign=document.getElementById('sign');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
new IntersectionObserver((e,o)=>{if(e[0].isIntersecting){sign.classList.add('lit');o.disconnect();}},{threshold:.6}).observe(sign);
sign.querySelectorAll('.leaf').forEach(a=>a.addEventListener('click',ev=>{
  if(reduce||ev.metaKey||ev.ctrlKey||ev.shiftKey)return;
  ev.preventDefault(); sign.classList.add(a.dataset.press);
  setTimeout(()=>{location.href=a.href;},420);
}));
addEventListener('pageshow',()=>sign.classList.remove('press-rest','press-street'));
</script>
</body>
</html>
